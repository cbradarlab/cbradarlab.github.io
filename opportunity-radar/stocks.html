<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="企業採購商機雷達｜上市櫃公司快選">
<title>上市櫃快選｜企業採購商機雷達</title>
<style>
:root{--bg:#f6f8fc;--card:#fff;--ink:#172033;--muted:#64748b;--line:#e2e8f0;--blue:#1e40af;--green:#047857}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:1050px;margin:auto;padding:26px 18px 60px}.hero{padding:28px;border-radius:22px;background:linear-gradient(135deg,#0f172a,#1e3a8a);color:#fff}.hero h1{margin:7px 0 10px;font-size:clamp(30px,5vw,48px)}.hero p{margin:0;line-height:1.7;opacity:.9}.topbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.topbar a,.topbar button{border:1px solid #ffffff44;background:#ffffff12;color:#fff;border-radius:12px;padding:10px 13px;text-decoration:none;font-weight:800;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px}.stat b{font-size:25px;display:block}.stat span{font-size:13px;color:var(--muted)}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.filters input,.filters select{padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:14px}.filters input{flex:1;min-width:220px}.grid{display:grid;gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.name{font-size:20px;font-weight:900}.stock{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0;border-radius:12px;padding:8px 10px;font-weight:900;white-space:nowrap}.meta{margin-top:6px;color:var(--muted);font-size:14px}.reason{margin-top:12px;padding:11px 13px;border-left:4px solid var(--blue);background:#f8fafc;border-radius:8px;line-height:1.6}.contact{margin-top:10px;font-size:13px;line-height:1.7;color:#475569}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions a{padding:8px 10px;border-radius:9px;text-decoration:none;font-size:13px;font-weight:800;border:1px solid #bfdbfe;background:#eff6ff;color:var(--blue)}.actions a.green{border-color:#a7f3d0;background:#ecfdf5;color:#065f46}.empty{padding:35px;text-align:center;background:#fff;border:1px dashed #cbd5e1;border-radius:16px;color:var(--muted)}.note{font-size:13px;color:var(--muted);line-height:1.7;margin-top:18px}
@media(max-width:700px){.stats{grid-template-columns:1fr}.head{flex-direction:column}.stock{align-self:flex-start}}
</style>
</head>
<body><div class="wrap">
<section class="hero"><div style="font-size:12px;font-weight:900;letter-spacing:.1em;opacity:.72">OPPORTUNITY RADAR · VERIFIED LISTED COMPANIES</div><h1>📈 上市櫃快選</h1><p>只顯示已由 TWSE／TPEx 官方公司資料精確對到股票代號的商機公司。不是用公司名稱猜股票，因此寧可少列，也不亂標。</p><div class="topbar"><a href="./">← 回商機雷達</a><button id="latest">只看最近 90 天</button></div></section>
<section class="stats"><div class="stat"><b id="companies">—</b><span>上市櫃公司</span></div><div class="stat"><b id="events">—</b><span>上市櫃商機事件</span></div><div class="stat"><b id="shown">—</b><span>目前顯示</span></div></section>
<div class="filters"><input id="q" placeholder="搜尋公司、股票代號、產業、事件內容"><select id="market"><option value="">全部市場</option><option value="TWSE">上市 TWSE</option><option value="TPEx">上櫃 TPEx</option></select><select id="age"><option value="all">全部日期</option><option value="90">最近 90 天</option><option value="180">最近 180 天</option><option value="365">最近 365 天</option></select><select id="sort"><option value="date">最新事件</option><option value="score">商機分數</option><option value="code">股票代號</option></select></div>
<main id="cards" class="grid"><div class="empty">正在載入上市櫃商機…</div></main>
<div class="note">股票身分只採 TWSE／TPEx 官方資料精確配對。這個頁面是「有股票的商機公司快選」，不是投資買進訊號；商機事件也不代表公司一定會採購特定商品。</div>
</div>
<script>
'use strict';
let EVENTS=[];const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function listed(e){return Boolean(String(e.stock_code||'').trim()&&String(e.market||'').trim())}
function withinDays(date,days){if(days==='all')return true;let t=Date.parse(String(date||'')+'T00:00:00');return Number.isFinite(t)&&(Date.now()-t)<=Number(days)*86400000}
function website(v){let s=String(v||'').trim();if(!s)return '';return /^https?:\/\//i.test(s)?s:'https://'+s.replace(/^\/+/, '')}
function blob(e){return [e.company,e.stock_code,e.market,e.industry,e.stage,e.title,e.city,e.district,...(e.explicit||[]),...(e.inferred||[])].join(' ').toLowerCase()}
function render(){let q=$('#q').value.trim().toLowerCase(),market=$('#market').value,age=$('#age').value,sort=$('#sort').value;let xs=EVENTS.filter(listed).filter(e=>(!market||e.market===market)&&withinDays(e.date,age)&&(!q||blob(e).includes(q)));if(sort==='score')xs.sort((a,b)=>Number(b.score||0)-Number(a.score||0)||String(b.date).localeCompare(String(a.date)));else if(sort==='code')xs.sort((a,b)=>String(a.stock_code).localeCompare(String(b.stock_code)));else xs.sort((a,b)=>String(b.date).localeCompare(String(a.date)));$('#shown').textContent=xs.length;let root=$('#cards');if(!xs.length){root.innerHTML='<div class="empty">目前沒有符合條件的上市櫃商機。</div>';return}root.innerHTML=xs.map(e=>{let m=e.market==='TWSE'?'上市':'上櫃';let contacts=[];if(e.company_phone)contacts.push('電話：'+esc(e.company_phone));if(e.company_email)contacts.push('Email：'+esc(e.company_email));let site=e.company_website?`<a class="green" href="${esc(website(e.company_website))}" target="_blank" rel="noopener">公司官網 ↗</a>`:'';return `<article class="card"><div class="head"><div><div class="name">${esc(e.company)}</div><div class="meta">${esc(e.date)}｜${esc(e.city||'地區待補')} ${esc(e.district||'')}｜${esc(e.industry||'')}</div></div><div class="stock">📈 ${m} ${esc(e.stock_code)}</div></div><div class="reason"><b>${esc(e.stage||'投資事件')}</b>${e.amount?`｜投資約 ${esc(e.amount)} 億元`:''}${e.score?`｜商機分數 ${esc(e.score)}`:''}</div>${contacts.length?`<div class="contact">${contacts.join('｜')}</div>`:''}<div class="actions"><a href="${esc(e.source)}" target="_blank" rel="noopener">商機官方來源 ↗</a>${site}<a href="https://www.google.com/search?q=${encodeURIComponent(String(e.company||'')+' 採購 聯絡 窗口')}" target="_blank" rel="noopener">找採購／聯絡 ↗</a></div></article>`}).join('')}
async function boot(){try{let u=new URL('events.json',document.baseURI);u.searchParams.set('v',Date.now());let r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('events.json HTTP '+r.status);EVENTS=await r.json();let listedEvents=EVENTS.filter(listed),companies=new Set(listedEvents.map(e=>e.stock_code));$('#companies').textContent=companies.size;$('#events').textContent=listedEvents.length;render()}catch(e){$('#cards').innerHTML=`<div class="empty">資料載入失敗：${esc(e.message||e)}</div>`}}
for(const id of ['q','market','age','sort'])$('#'+id).addEventListener(id==='q'?'input':'change',render);$('#latest').onclick=()=>{$('#age').value='90';render()};boot();
</script></body></html>
