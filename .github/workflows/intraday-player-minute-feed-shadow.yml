name: Intraday player minute feed SHADOW
on:
  workflow_dispatch:
    inputs:
      trade_date:
        description: 'Optional YYYY-MM-DD (blank = Taiwan today)'
        required: false
        type: string
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'shioaji>=1.0,<2'
      - name: Sample 30 stock intraday minutes (SHADOW only)
        env:
          SHIOAJI_API_KEY: ${{ secrets.SHIOAJI_API_KEY }}
          SHIOAJI_SECRET_KEY: ${{ secrets.SHIOAJI_SECRET_KEY }}
          TRADE_DATE: ${{ inputs.trade_date }}
          SAMPLE_COUNT: '30'
        run: python sector-rotation/shadow_intraday_player_feed.py
      - name: Build private sample sector-minute frames
        run: python sector-rotation/shadow_sector_minute_aggregate.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intraday-player-feed-shadow
          path: |
            intraday_player_feed_shadow.json
            sector_minute_aggregate_shadow.json
          retention-days: 1
          if-no-files-found: ignore
