name: PCB minute coverage SHADOW audit
on:
  push:
    branches: [main]
    paths:
      - 'sector-rotation/audit_pcb_minute_coverage.py'
      - 'sector-rotation/test_pcb_minute_coverage.py'
      - 'sector-rotation/data/pcb_chain_roles_shadow.csv'
      - 'sector-rotation/data/latest.json'
      - '.github/workflows/sector-rotation-pcb-coverage-shadow.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline PCB coverage regression tests
        run: python -m unittest discover -s sector-rotation -p 'test_pcb_minute_coverage.py' -v
      - name: Audit existing SHADOW snapshot
        run: python sector-rotation/audit_pcb_minute_coverage.py sector-rotation/data/latest.json
