name: Update official TWSE TPEx industry registry
on:
  push:
    branches: [main]
    paths:
      - 'sector-rotation/build_official_industries.py'
      - 'sector-rotation/build_stock_panel_memberships.py'
      - 'sector-rotation/data/sector_taxonomy.json'
      - 'sector-rotation/data/reviewed_stock_themes.csv'
  workflow_dispatch:
  schedule:
    - cron: '30 11 * * 1-5'
permissions:
  contents: write
concurrency:
  group: official-stock-industries
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch and validate official company classifications
        run: |
          python sector-rotation/build_official_industries.py
          python sector-rotation/build_stock_panel_memberships.py
      - name: Commit updated registry
        run: |
          git add sector-rotation/data/official_stock_industries.csv sector-rotation/data/official_stock_industries_report.json sector-rotation/data/stock_panel_memberships.csv sector-rotation/data/stock_panel_review.csv sector-rotation/data/stock_panel_report.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'data: refresh official TWSE TPEx industry registry [skip ci]'
          git push
