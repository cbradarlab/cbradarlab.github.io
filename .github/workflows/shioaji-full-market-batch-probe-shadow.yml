name: Shioaji full-market bounded batch probe SHADOW
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'shioaji>=1.0,<2'
      - name: Probe at most 30 historical K-bar requests, no licensed quote export
        env:
          SHIOAJI_API_KEY: ${{ secrets.SHIOAJI_API_KEY }}
          SHIOAJI_SECRET_KEY: ${{ secrets.SHIOAJI_SECRET_KEY }}
          PROBE_DATE: '2026-10-30'
          BATCH_SIZE: '30'
          MAX_SECONDS: '150'
        run: python sector-rotation/shadow_full_market_batch_probe.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-market-batch-performance-shadow
          path: full_market_batch_performance_shadow.json
          if-no-files-found: ignore
