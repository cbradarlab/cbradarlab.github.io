name: Publish sector rotation minute snapshot (SHADOW)
on:
  push:
    paths:
      - 'sector-rotation/incoming/*.csv'
      - 'sector-rotation/build_daily_data.py'
      - '.github/workflows/sector-rotation-publish.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sector-rotation-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Find latest dated CSV and validate
        id: prepare
        shell: bash
        run: |
          python - <<'PY'
          import glob, os
          from pathlib import Path
          files = sorted(glob.glob('sector-rotation/incoming/*.csv'))
          if not files:
              print('No incoming CSV yet. Skipping publication.')
              with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write('ready=false\n')
          else:
              source=files[-1]
              print('Preparing', source)
              with open(os.environ['GITHUB_OUTPUT'],'a') as out:
                  out.write('ready=true\n')
                  out.write('source='+source+'\n')
          PY
      - name: Build JSON snapshot
        if: steps.prepare.outputs.ready == 'true'
        run: python sector-rotation/build_daily_data.py "${{ steps.prepare.outputs.source }}" sector-rotation/data/latest.json
      - name: Reject incomplete or regressed snapshots
        if: steps.prepare.outputs.ready == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          current = json.loads(Path('sector-rotation/data/latest.json').read_text(encoding='utf-8'))
          c = current['coverage']
          if c['minutes'] != 265 or c['industries'] < 2 or c['partial_stocks']:
              raise SystemExit('BLOCKED: incomplete 265-minute coverage or fewer than 2 industries')
          import subprocess
          old = subprocess.run(['git','show','HEAD:sector-rotation/data/latest.json'],capture_output=True,text=True)
          if old.returncode == 0:
              previous = json.loads(old.stdout)
              if current['date'] < previous['date']:
                  raise SystemExit('BLOCKED: snapshot date is older than the published date')
              if current['date'] == previous['date'] and c['stocks'] < previous['coverage']['stocks']:
                  raise SystemExit('BLOCKED: same-day stock coverage decreased')
          print('PASS: snapshot publication safety checks')
          PY
      - name: Commit published snapshot
        if: steps.prepare.outputs.ready == 'true'
        shell: bash
        run: |
          git add sector-rotation/data/latest.json
          if git diff --cached --quiet; then
            echo "No snapshot changes"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'data: publish validated sector minute snapshot [skip ci]'
          git push
