name: CBAS Official Closing Prices SHADOW
on:
  workflow_dispatch:
# HOLD: official daily source returned non-CSV; no unattended runs until verified.
permissions:
  contents: write
concurrency:
  group: cbas-official-prices-shadow
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch and verify official TPEx closing report
        run: python cbas-data/sync_official_prices.py
      - name: Publish official prices only (no personal holdings)
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add cbas-data/official_prices_latest.json
          git diff --cached --quiet || (git commit -m 'data: CBAS shadow official closing prices' && git push)
