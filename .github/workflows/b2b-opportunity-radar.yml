name: B2B Opportunity Radar Daily Refresh

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'opportunity-radar/update.py'
      - 'opportunity-radar/augment_local.py'
      - 'opportunity-radar/augment_regions.py'
      - 'opportunity-radar/merge_history.py'
      - 'opportunity-radar/index.html'
      - 'opportunity-radar/product_catalog.json'
      - 'opportunity-radar/intent_rules.json'
      - 'opportunity-radar/search_rule_overrides.json'
      - 'opportunity-radar/catalog_gate.py'
      - 'opportunity-radar/search_quality_audit.py'
      - 'opportunity-radar/actionability_audit.py'
      - '.github/workflows/b2b-opportunity-radar.yml'
  schedule:
    # 00:20 UTC = 08:20 Taiwan
    - cron: '20 0 * * *'

permissions:
  contents: write

concurrency:
  group: b2b-opportunity-radar-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate product and service coverage
        run: python opportunity-radar/catalog_gate.py
      - name: Audit current production search quality
        run: python opportunity-radar/search_quality_audit.py
      - name: Upload search quality report
        uses: actions/upload-artifact@v4
        with:
          name: search-quality-report
          path: opportunity-radar/search_quality_report.json
          retention-days: 7
      - name: Preserve prior opportunity history
        run: cp opportunity-radar/events.json /tmp/opportunity-events-before.json
      - name: Refresh latest central official opportunity data
        shell: bash
        run: |
          cd opportunity-radar
          python -c "import update; update.BUILD_MONTHS=0; update.MAX_ARTICLES=8; update.main()"
      - name: Add latest Tainan early signals
        env:
          TAINAN_PAGES: '2'
          TAINAN_MAX_ARTICLES: '12'
        run: python opportunity-radar/augment_local.py
      - name: Add latest regional early signals
        env:
          KAOHSIUNG_PAGES: '2'
          KAOHSIUNG_MAX_ARTICLES: '12'
          TAICHUNG_PAGES: '2'
          TAICHUNG_MAX_ARTICLES: '12'
          TAOYUAN_PAGES: '0'
          TAOYUAN_MAX_ARTICLES: '12'
          HSINCHU_PAGES: '0'
          HSINCHU_MAX_ARTICLES: '0'
        run: python opportunity-radar/augment_regions.py
      - name: Preserve history and dedupe timelines
        run: python opportunity-radar/merge_history.py
      - name: Audit refreshed search quality
        run: python opportunity-radar/search_quality_audit.py
      - name: Audit result actionability
        run: python opportunity-radar/actionability_audit.py
      - name: Upload actionability report
        uses: actions/upload-artifact@v4
        with:
          name: actionability-report
          path: opportunity-radar/actionability_report.json
          retention-days: 7
      - name: Commit healthy refresh
        shell: bash
        run: |
          git config user.name "opportunity-radar-bot"
          git config user.email "opportunity-radar-bot@users.noreply.github.com"
          git add opportunity-radar/events.json opportunity-radar/status.json opportunity-radar/search_quality_report.json opportunity-radar/actionability_report.json opportunity-radar/topics/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: refresh opportunity radar [skip ci]"
            git pull --rebase origin main
            git push
          fi