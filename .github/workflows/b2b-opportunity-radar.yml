name: B2B Opportunity Radar Daily Refresh

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'opportunity-radar/update.py'
      - 'opportunity-radar/augment_local.py'
      - 'opportunity-radar/augment_regions.py'
      - 'opportunity-radar/merge_history.py'
      - 'opportunity-radar/index.html'
      - '.github/workflows/b2b-opportunity-radar.yml'
  schedule:
    # 00:20 UTC = 08:20 Taiwan
    - cron: '20 0 * * *'

permissions:
  contents: write

concurrency:
  group: b2b-opportunity-radar-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve prior opportunity history
        run: cp opportunity-radar/events.json /tmp/opportunity-events-before.json
      - name: Refresh latest central official opportunity data
        shell: bash
        run: |
          cd opportunity-radar
          python -c "import update; update.BUILD_MONTHS=0; update.MAX_ARTICLES=8; update.main()"
      - name: Add latest Tainan early signals
        env:
          TAINAN_PAGES: '4'
          TAINAN_MAX_ARTICLES: '30'
        run: python opportunity-radar/augment_local.py
      - name: Add latest Kaohsiung and Taichung early signals
        env:
          KAOHSIUNG_PAGES: '4'
          KAOHSIUNG_MAX_ARTICLES: '30'
          TAICHUNG_PAGES: '4'
          TAICHUNG_MAX_ARTICLES: '30'
        run: python opportunity-radar/augment_regions.py
      - name: Preserve history and dedupe timelines
        run: python opportunity-radar/merge_history.py
      - name: Commit healthy refresh
        shell: bash
        run: |
          git config user.name "opportunity-radar-bot"
          git config user.email "opportunity-radar-bot@users.noreply.github.com"
          git add opportunity-radar/events.json opportunity-radar/status.json opportunity-radar/topics/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: refresh opportunity radar [skip ci]"
            git pull --rebase origin main
            git push
          fi
