name: PCB21 cloud coverage SHADOW (manual pilot)
on:
  workflow_dispatch:
    inputs:
      trade_date:
        description: 'Trading day YYYY-MM-DD (pilot: 2026-10-30)'
        required: true
        default: '2026-10-30'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'shioaji>=1.0,<2'
      - name: Audit 21 stocks without licensed OHLC or GitHub writes
        env:
          SHIOAJI_API_KEY: ${{ secrets.SHIOAJI_API_KEY }}
          SHIOAJI_SECRET_KEY: ${{ secrets.SHIOAJI_SECRET_KEY }}
          TRADE_DATE: ${{ inputs.trade_date }}
        run: python sector-rotation/shadow_pcb21_cloud_audit.py
      - name: Upload summary only (no licensed quotes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcb21-shadow-coverage
          path: pcb21_coverage_summary_shadow.json
          if-no-files-found: ignore
