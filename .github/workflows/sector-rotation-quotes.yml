name: Sector Rotation - Official Closing Quotes Shadow
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sector-rotation/sync_quotes.py'
      - 'sector-rotation/rotation_engine.py'
      - 'sector-rotation/test_rotation_engine.py'
      - '.github/workflows/sector-rotation-quotes.yml'
  schedule:
    - cron: '25 9 * * 1-5'
permissions:
  contents: write
concurrency:
  group: sector-rotation-quotes
  cancel-in-progress: false
jobs:
  quote-shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Fetch and validate official closing quotes
        run: python sector-rotation/sync_quotes.py
      - name: Test rotation engine and calculate safe shadow status
        run: |
          python -m unittest discover -s sector-rotation -p 'test_rotation_engine.py' -v
          python sector-rotation/rotation_engine.py
      - name: Commit only validated shadow quote snapshot
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add sector-rotation/data/quotes_latest.json sector-rotation/data/quotes_history.json sector-rotation/data/rotation_shadow.json
          git diff --cached --quiet || (git commit -m 'data: sector rotation quotes shadow snapshot' && git push)
