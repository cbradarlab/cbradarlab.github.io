<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>台股產業輪動｜雲端預覽</title><style>body{font-family:system-ui,"Microsoft JhengHei",sans-serif;background:#f5f7fa;color:#172438;max-width:1100px;margin:auto;padding:20px}h1{margin-bottom:8px}.muted{color:#64748b}.bar{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}button,input,select{padding:10px;border:1px solid #ccd6e0;border-radius:9px;background:white}button{cursor:pointer}.card{background:white;padding:15px;border:1px solid #e0e6ee;border-radius:12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}.heart{float:right;color:#e11d48}.warn{background:#fff4d6;padding:12px;border-radius:10px;margin:15px 0}small{color:#64748b}</style><h1>台股產業輪動 <small>雲端預覽</small></h1><p class="muted">上市／上櫃股票分類、搜尋、愛心自選。CB 自動同步與每日行情尚待驗收。</p><div class="warn" id="status">正在連線官方股票主檔；未取得資料時不顯示假行情。</div><div class="bar"><input id="search" placeholder="股票代號／名稱"><select id="industry"><option value="">全部產業</option></select><label><input type="checkbox" id="onlyFav"> 只看愛心</label><button id="refresh">重新同步</button></div><p id="count"></p><div class="grid" id="cards"></div><script>
const feeds=[['上市','https://openapi.twse.com.tw/v1/opendata/t187ap03_L'],['上櫃','https://www.tpex.org.tw/openapi/v1/mopsfin_t187ap03_O']];let stocks=[],fav=new Set(JSON.parse(localStorage.getItem('sectorRotationFav')||'[]'));const el=id=>document.getElementById(id);function field(o,keys){for(const k of keys)if(o[k]!=null&&String(o[k]).trim())return String(o[k]).trim();return ''}function normalize(o,market){return{id:field(o,['公司代號','股票代號','SecuritiesCompanyCode','Code']),name:field(o,['公司名稱','公司簡稱','股票名稱','SecuritiesCompanyName','Name']),industry:field(o,['產業別','產業類別','Industry','IndustryType'])||'未分類',market}}function render(){let q=el('search').value.trim(),i=el('industry').value,f=el('onlyFav').checked;let a=stocks.filter(s=>(!q||s.id.includes(q)||s.name.includes(q))&&(!i||s.industry===i)&&(!f||fav.has(s.id)));el('count').textContent='顯示 '+a.length+'／'+stocks.length+' 檔（官方公司主檔，非即時報價）';el('cards').replaceChildren(...a.slice(0,400).map(s=>{let d=document.createElement('div');d.className='card';let b=document.createElement('button');b.className='heart';b.textContent=fav.has(s.id)?'♥':'♡';b.onclick=()=>{fav.has(s.id)?fav.delete(s.id):fav.add(s.id);localStorage.setItem('sectorRotationFav',JSON.stringify([...fav]));render()};let title=document.createElement('strong');title.textContent=s.id+' '+s.name;let detail=document.createElement('p');detail.textContent=s.market+' · '+s.industry;d.append(b,title,detail);return d}));if(a.length>400)el('count').textContent+='（為保持速度，僅顯示前 400 檔；可搜尋縮小範圍）'}async function sync(){el('status').textContent='連線官方來源中…';let all=[],notes=[];for(const [market,url] of feeds){try{let r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let j=await r.json();if(!Array.isArray(j))throw Error('非陣列');let rows=j.map(x=>normalize(x,market)).filter(x=>/^\d{4}$/.test(x.id));if(rows.length<300)throw Error('資料筆數不足 '+rows.length);all.push(...rows);notes.push(market+' '+rows.length+'檔')}catch(e){notes.push(market+'失敗：'+e.message)}}if(all.length){stocks=[...new Map(all.map(x=>[x.id,x])).values()];el('industry').replaceChildren(new Option('全部產業',''),...[...new Set(stocks.map(x=>x.industry))].sort().map(x=>new Option(x,x)));el('status').textContent='官方公司主檔：'+notes.join('；')+'。本頁尚未接入真實每日行情及 CB 資料。';}else{el('status').textContent='官方資料無法由瀏覽器直接取得（可能為 CORS 或來源異動）。目前不顯示示範股票，以免誤認真實資料。'}render()}['search','industry','onlyFav'].forEach(id=>el(id).addEventListener('input',render));el('refresh').onclick=sync;sync();</script></html>
